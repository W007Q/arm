# Motor angles and finger travel default to rebotarm_description parameters.
# Hardware profiles require measured PA43 thresholds, TCP and hand-eye calibration.
pick:
  backend: mujoco
  hardware_calibrated: false
  command_open_mm: 90.0
  base_gap_m: 0.0193
  minimum_object_m: 0.01
  squeeze_m: 0.003
  preopen_clearance_m: 0.006
  yaw_aspect_min_ratio: 1.3
  sim_force_limit_n: 2.0
  sim_contact_force_n: 0.15
  hardware_torque_limit_nm: 0.0
  hardware_contact_torque_nm: 0.0
  gap_tolerance_m: 0.003
  stable_gap_speed_mps: 0.01
  minimum_contact_travel_m: 0.004
  contact_endstop_clearance_m: 0.003
  settle_sec: 0.25
  feedback_timeout_sec: 0.5
  lift_verify_m: 0.035
  hold_sec: 2.0
  top_down_quat_xyzw:
  - -0.00113043
  - 0.27370228
  - 0.00397238
  - 0.9618056
  transit_z_m: 0.16
  transit_z_by_color:
    red: 0.23
    blue: 0.21
    yellow: 0.21
  safe_grasp_z_by_color:
    red: 0.16
    blue: 0.154
    yellow: 0.168
  align_clearance_m: 0.05
  min_align_z_m: 0.145
  pregrasp_clearance_m: 0.04
  first_lift_min_m: 0.225
  first_lift_clearance_m: 0.02
  lift_z_m: 0.240
  lift_retract_m: 0.025
  surface_tcp_clearance_m: 0.005
  observation_x_m: 0.34
  observation_z_m: 0.23
  observation_y_by_color:
    red:
    - 0.0
    - -0.12
    blue:
    - 0.0
    yellow:
    - 0.14
    - 0.0
    auto:
    - 0.0
    - 0.14
    - -0.14
